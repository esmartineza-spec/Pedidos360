spring.application.name=ms-bodega

server.port=${SERVER_PORT:8084}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:ms-bodega-consumers}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.streams.application-id=${KAFKA_STREAMS_APPLICATION_ID:ms-bodega-streams}